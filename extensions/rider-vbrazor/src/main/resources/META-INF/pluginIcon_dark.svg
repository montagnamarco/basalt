<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="40" height="40">
  <!--
    The plugin icon, from the same drawing as the IDE's own: a
    plugin that looked like something else in the marketplace
    would be a second identity to keep in step.
  -->
<rect width="64" height="64" rx="12" fill="#2B2B2F"/>

  <!-- the column behind, dulled by distance -->
  <path d="M38.21,32.20 L38.21,27.80 L46.00,25.60 L46.00,50.00 L38.21,50.00 Z" fill="#A8410F"/>
  <path d="M46.00,25.60 L53.79,27.80 L53.79,32.20 L53.79,50.00 L46.00,50.00 Z" fill="#7A2C0C"/>
  <path d="M38.21,32.20 L46.00,34.40 L53.79,32.20 L53.79,27.80 L46.00,25.60 L38.21,27.80 Z" fill="#C9822F"/>

  <!-- the left column -->
  <path d="M11.21,34.20 L11.21,29.80 L19.00,27.60 L19.00,50.00 L11.21,50.00 Z" fill="#C2491A"/>
  <path d="M19.00,27.60 L26.79,29.80 L26.79,34.20 L26.79,50.00 L19.00,50.00 Z" fill="#8A3210"/>
  <path d="M11.21,34.20 L19.00,36.40 L26.79,34.20 L26.79,29.80 L19.00,27.60 L11.21,29.80 Z" fill="#E2963A"/>

  <!-- the tallest, nearest the viewer -->
  <path d="M23.91,22.55 L23.91,17.45 L33.00,14.90 L33.00,50.00 L23.91,50.00 Z" fill="#D9531E"/>
  <path d="M33.00,14.90 L42.09,17.45 L42.09,22.55 L42.09,50.00 L33.00,50.00 Z" fill="#96360F"/>
  <path d="M23.91,22.55 L33.00,25.10 L42.09,22.55 L42.09,17.45 L33.00,14.90 L23.91,17.45 Z" fill="#F2A03D"/>
</svg>
