    The same honeycomb at sixteen and twenty-four pixels. Drawn with wider
    gaps (a whole pixel at sixteen) and lighter greys: at the full artwork's
    proportions the gaps fall between pixels and the ring of hexagonal
    columns turns into one grey blot around the orange. Checked by
    rasterising and looking, not by reasoning about it.
  -->

