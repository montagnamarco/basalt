<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!--
    The application icon: the volcano the IDE draws for IconKind.Application,
    in the same 16 by 16 box. Kept as the source the platform icon files are
    rendered from, so the window, the dock and the menu cannot drift apart.
  -->
  <rect width="16" height="16" rx="3" fill="#1B1B1F"/>

  <!-- The cone. -->
  <path d="M1.5,14 L6.2,4.6 L6.9,3.5 L9.1,3.5 L9.8,4.6 L14.5,14 Z" fill="#B03F16"/>

  <!-- The lit face, left of the summit: enough contrast to read as a solid. -->
  <path d="M1.5,14 L6.2,4.6 L6.9,3.5 L8,3.5 L8,14 Z" fill="#D9531E"/>

  <!-- Lava, out of the crater and down the right flank. -->
  <path d="M8.2,4.2 L9.2,4.2 L10.4,6.4 L9.6,7.9 L11,10 L10.2,11.5 L12,14 L10.4,14
           L8.7,11.4 L9.5,10 L8.1,7.8 L8.9,6.3 Z" fill="#F2A03D"/>

  <!-- The crater: an opening, darker than anything around it. -->
  <path d="M6.9,3.5 L9.1,3.5 L8.5,4.5 L7.5,4.5 Z" fill="#141417"/>

  <!-- Two sparks above the crater. -->
  <path d="M6.5,1.4 L7.2,2.4 L6.1,2.8 Z" fill="#F2A03D"/>
  <path d="M9.7,1.0 L10.3,2.0 L9.3,2.3 Z" fill="#F6C445"/>
</svg>
