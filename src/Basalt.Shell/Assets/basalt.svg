<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <!--
    Basalt: the rock the IDE is named after. Cooling lava shrinks and cracks
    into hexagonal columns; seen from above, their tops fit together as a
    honeycomb. Seven of them here, the one in the middle still molten.

    The greys differ a little from cell to cell, as the tops of real columns
    stand at slightly different heights and catch the light differently.
    Chosen by Marco on 27/09/2026 from five proposals ("Giunzione").
  -->

  <rect width="64" height="64" rx="14" fill="#17191C"/>
  <path d="M32,22.8 L39.97,27.4 L39.97,36.6 L32,41.2 L24.03,36.6 L24.03,27.4 Z" fill="#E4572E"/>
  <path d="M49.53,22.8 L57.5,27.4 L57.5,36.6 L49.53,41.2 L41.57,36.6 L41.57,27.4 Z" fill="#6B737C"/>
  <path d="M40.77,37.99 L48.73,42.59 L48.73,51.79 L40.77,56.39 L32.8,51.79 L32.8,42.59 Z" fill="#59616A"/>
  <path d="M23.23,37.99 L31.2,42.59 L31.2,51.79 L23.23,56.39 L15.27,51.79 L15.27,42.59 Z" fill="#7C858E"/>
  <path d="M14.47,22.8 L22.43,27.4 L22.43,36.6 L14.47,41.2 L6.5,36.6 L6.5,27.4 Z" fill="#4F565E"/>
  <path d="M23.23,7.61 L31.2,12.21 L31.2,21.41 L23.23,26.01 L15.27,21.41 L15.27,12.21 Z" fill="#666E77"/>
  <path d="M40.77,7.61 L48.73,12.21 L48.73,21.41 L40.77,26.01 L32.8,21.41 L32.8,12.21 Z" fill="#5A6169"/>
</svg>
