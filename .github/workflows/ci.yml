# Build and test on the three operating systems the suite must stay green on,
# then pack and verify the NuGet packages. Nothing is published or pushed.
# Editor extension jobs (VS Code, Rider, VSIX) come with their phase.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # netcoredbg and clang, so the debugger and native QuickBASIC tests run
      # instead of being skipped. Optional: a runner without them skips those
      # tests, which say why, rather than failing the build.
      - name: Tools (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          build/setup-dev.ps1
          "C:\Program Files\LLVM\bin" | Out-File -Append $env:GITHUB_PATH

      - name: Tools (macOS/Linux)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: bash build/setup-dev.sh

      - name: Build
        run: dotnet build Basalt.slnx -c Debug --nologo

      # The browser the end-to-end tests drive, on the runner only; locally
      # they use the Edge already installed on Windows.
      - name: Browser for end-to-end tests
        shell: pwsh
        run: tests/Basalt.E2E.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # Avalonia runs headless in the tests, so the Linux runner needs no display.
      - name: Test
        run: dotnet test Basalt.slnx --no-build --nologo --logger trx --results-directory test-results
        env:
          BASALT_PLUGINS: ${{ runner.temp }}/plugins

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results

  pack:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The full verification: installs the templates on the runner, which is
      # thrown away afterwards, and builds a project from the packages alone.
      - name: Pack and verify
        run: bash build/pack.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
